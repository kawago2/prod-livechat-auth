<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
 <script>
  const rcwidgetcss = document.createElement('link');
  rcwidgetcss.rel = 'stylesheet';
  rcwidgetcss.href = 'https://app.raisecall.com/rcwidget/raise-call-widget.css';
  document.head.prepend(rcwidgetcss);
  const rcwidget = document.createElement('script');
  rcwidget.src = 'https://app.raisecall.com/rcwidget/raise-call-widget.umd.js';
  document.head.prepend(rcwidget);
  rcwidget.onload = function () {
    RaiseCallWidget({
      webchatUUID: '32d5c734-a953-42ff-aa09-a5a95d6772e5',
      orgUUID: '03420026-0a27-4378-b036-c2cf1eb76a36',
    });
  };
</script>
</head>

<body>
  <section class="container d-flex w-100 h-100 align-items-center justify-content-center">
    <form id="loginForm" class="d-flex flex-column w-50 gap-4">
      <div class="form-floating">
        <input type="email" class="form-control" id="username" placeholder="name@example.com">
        <label for="username">Email address</label>
      </div>
      <div class="form-floating">
        <input type="password" class="form-control" id="password" placeholder="***">
        <label for="password">Password</label>
      </div>
      <button type="submit" class="btn btn-primary">Login</button>
    </form>
  </section>
  <div id="message"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  <script>
    const secretCode = 'CX6npqLM02Nv5nvZ';
    const widget = document.getElementById('raisecall-embedded-widget');
    const loginForm = document.getElementById('loginForm');
    if (widget) {
      widget.style.display = localStorage.getItem('raisecall_token') ? 'block' : 'none';
    }
    if (loginForm) {
      loginForm.style.display = localStorage.getItem('raisecall_token') ? 'none' : 'flex';
    }
    const secretKey = CryptoJS.enc.Utf8.parse(secretCode);
    function encryptUserData(user) {
      const plaintext = JSON.stringify(user);
      const encrypted = CryptoJS.AES.encrypt(plaintext, secretKey, {
        mode: CryptoJS.mode.ECB,
        padding: CryptoJS.pad.Pkcs7,
      }).toString();
      return encrypted;
    }
    // Simulated users.json (mock database)
    let users = [];

    // Load the JSON from an external file
    fetch("./database-dummy.json")
      .then(response => {
        if (!response.ok) {
          throw new Error("Failed to load users.json");
        }
        return response.json();
      })
      .then(data => {
        users = data;
      })
      .catch(error => {
        console.error("Error loading JSON:", error);
      });

    const form = document.getElementById("loginForm");
    const messageDiv = document.getElementById("message");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const email = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      const foundUser = users.find(
        user => user.username === email && user.password === password
      );

      if (foundUser) {
        const { password, ...newBody } = foundUser;
        const dataUser = encryptUserData(newBody);
        localStorage.setItem('raisecall_token', dataUser);
        messageDiv.textContent = "✅ Login successful!";
        messageDiv.style.color = "green";
        setTimeout(() => {
          window.location.replace('/home')
        }, 500);
        // You can redirect or do something else here
      } else {
        messageDiv.textContent = "❌ Invalid email or password.";
        messageDiv.style.color = "red";
      }
    });
  </script>
</body>

</html>
